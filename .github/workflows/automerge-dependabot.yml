name: Auto-Merge Dependabot PRs

# Automatically approves and merges Dependabot PRs once the required CI
# checks (test-and-release.yml) pass - but only for patch/minor version
# bumps. Major version bumps are left for manual review, since e.g. a
# socket.io-client major update can change the Socket.IO wire protocol
# used to talk to the WAIP server.
#
# Note: merging here only lands the change on `main`. Publishing to npm
# still requires a separate `v*` tag push (see test-and-release.yml), so
# this cannot trigger an unattended release.
#
# Requires "Allow auto-merge" to be enabled under Settings > General >
# Pull Requests, otherwise `gh pr merge --auto` has no effect.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge (patch/minor only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
